name: Build and release Megadict

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if upstream checksums match
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'sources.json'
      - 'build.ps1'
      - 'fetch.ps1'
      - 'verify.mjs'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: megadict-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'caocaochan/Megadict'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve upstream releases
        id: sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name == 'push' || inputs.force }}
        run: ./fetch.ps1 -IfChanged:($env:FORCE_BUILD -ne 'true')

      - name: Build Megadict
        if: steps.sources.outputs.changed == 'true'
        shell: pwsh
        run: ./build.ps1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.sources.outputs.changed == 'true'
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate with official Yomitan schemas
        if: steps.sources.outputs.changed == 'true'
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output .cache/yomitan-validator.zip \
            https://github.com/yomidevs/yomitan/releases/download/26.11.10.0/yomitan-chrome-playwright.zip
          echo 'b613873890195cd082bbada5a1e3bc85cd6954588242f9efa928e1605b88b53b  .cache/yomitan-validator.zip' | sha256sum --check
          unzip -q .cache/yomitan-validator.zip -d .cache/yomitan lib/validate-schemas.js lib/zip.js
          node --version
          node verify.mjs .cache/yomitan dist

      - name: Publish archive and update index
        if: steps.sources.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $revision = (Get-Content -Raw dist/index.json | ConvertFrom-Json).revision
          $tag = "v$revision"
          $sources = Get-Content -Raw dist/sources.json | ConvertFrom-Json
          $rows = ($sources | Measure-Object -Property rows -Sum).Sum
          @(
            "Yomitan dictionary with $('{0:N0}' -f $rows) term rows from $($sources.Count) sources."
            ''
            'Import Megadict.zip in Yomitan. Use **Check for updates** for later revisions.'
            ''
            '### Dictionary revisions'
            ''
            foreach ($source in $sources) { "- [$($source.title)]($($source.release)) $($source.revision)" }
          ) | Set-Content dist/release-notes.md
          gh release create $tag --draft --target $env:GITHUB_SHA --title "Megadict $revision" `
            --notes-file dist/release-notes.md dist/Megadict.zip dist/index.json dist/sources.json
          gh release edit $tag --draft=false --latest
